
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoharmony-park"
version = "0.1.0"
description = "TP6 TDD - Ingenieria y Calidad de Software"
requires-python = ">=3.12"
dependencies = [
    "qrcode[pil]>=8,<9"
]

[project.optional-dependencies]
web = [
    "Flask>=3.1,<4"
]
dev = [
    "pytest>=8,<10",
    "zxing-cpp>=3,<4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
